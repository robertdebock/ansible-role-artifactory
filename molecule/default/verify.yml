---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    # Artifactory needs a few minutes to start.
    - name: Try the Artifactory ping API
      ansible.builtin.uri:
        url: "http://localhost:8082/artifactory/api/system/ping"
        return_content: true
      register: artifactory_try_ping
      failed_when:
        - "'OK' not in artifactory_try_ping.content"
      retries: 60
      delay: 10
      until:
        - artifactory_try_ping is succeeded
