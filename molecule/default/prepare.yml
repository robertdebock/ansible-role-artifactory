---
- name: Prepare
  hosts: all
  gather_facts: false
  become: true

  roles:
    - role: robertdebock.bootstrap
    - role: robertdebock.core_dependencies
    - role: robertdebock.java
      java_vendor: openjdk
      java_type: jre
    - role: robertdebock.postgres
      postgres_hba_entries:
        - type: local
          database: all
          user: all
          method: peer
        - type: host
          database: all
          user: all
          address: "127.0.0.1/32"
          method: scram-sha-256
        - type: host
          database: all
          user: all
          address: "::1/128"
          method: scram-sha-256
      postgres_databases:
        - name: artifactory
      postgres_users:
        - name: artifactory
          password: artifactory
          db: artifactory

  post_tasks:
    # PostgreSQL 15 and later do not let ordinary users create objects in the public schema,
    # so the artifactory user needs to own the database.
    - name: Make artifactory the owner of the database
      community.postgresql.postgresql_db:
        db: artifactory
        owner: artifactory
      become_user: postgres
